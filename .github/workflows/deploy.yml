name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .


      - name: Lint
        run: npx next lint --max-warnings=0 || npx eslint .

      - name: Build (static export · preview)
        # 검증 배포. 색인 승인이 없으므로 sitemap URL·canonical·JSON-LD 를 내지 않는다.
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: preview
          NEXT_PUBLIC_SITE_ORIGIN: https://humease21.github.io
          NEXT_PUBLIC_BASE_PATH: /humease-web-v2

      - name: 검증 (docs/04 §2)
        # basePath 이탈·이중 적용 검사는 빌드와 같은 환경값이 있어야 동작한다.
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: preview
          NEXT_PUBLIC_BASE_PATH: /humease-web-v2
        run: |
          node scripts/verify-routes.mjs
          node scripts/verify-indexing-policy.mjs
          node scripts/verify-copy.mjs
          node scripts/verify-request-copy.mjs
          node scripts/verify-content.mjs
          node scripts/verify-aliases.mjs
          node scripts/verify-assets.mjs
          node scripts/verify-client-exposure.mjs
          node scripts/verify-font-subset.mjs

      - name: 운영 dry-run 검사
        # 운영 산출물의 canonical·sitemap·JSON-LD 계약을 검사한다.
        # ⚠ 이 산출물은 업로드하지 않는다. 검증 Pages 에 게시하면 색인 가능한 복제본이 생긴다.
        run: |
          cp -r out /tmp/out-preview
          rm -rf .next out
          npm run build
          node scripts/verify-indexing-policy.mjs
          node scripts/verify-entities.mjs
          rm -rf .next out
          mv /tmp/out-preview out
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: production
          NEXT_PUBLIC_SITE_ORIGIN: https://www.humease.com
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SEARCH_INDEXING_ENABLED: 'true'

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
