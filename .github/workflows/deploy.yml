name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .


      - name: Lint
        run: npx next lint --max-warnings=0 || npx eslint .

      - name: Build (static export)
        # 프로젝트 Pages 는 /humease-web-v2 하위 경로로 서빙된다.
        # 커스텀 도메인 연결 시 이 값을 빈 문자열로 바꾼다(ADR-001 §5).
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /humease-web-v2

      - name: 검증 (docs/04 §2)
        run: |
          node scripts/verify-routes.mjs
          node scripts/verify-copy.mjs
          node scripts/verify-request-copy.mjs
          node scripts/verify-content.mjs
          node scripts/verify-assets.mjs
          node scripts/verify-client-exposure.mjs
          node scripts/verify-font-subset.mjs

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
