name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # ── 1) preview 빌드 — 회귀 검증 전용. 업로드하지 않는다 ──────────────
      # basePath 가 있는 조건에서만 드러나는 결함(자산 경로 이탈, 이중 접두사,
      # 검증 환경의 noindex·canonical 미출력 계약)을 잡기 위해 계속 실행한다.
      - name: Build — preview (회귀 검증 전용)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: preview
          NEXT_PUBLIC_SITE_ORIGIN: https://humease21.github.io
          NEXT_PUBLIC_BASE_PATH: /humease-web-v2

      - name: 검증 — preview 산출물
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: preview
          NEXT_PUBLIC_BASE_PATH: /humease-web-v2
        run: |
          node scripts/verify-routes.mjs
          node scripts/verify-indexing-policy.mjs
          node scripts/verify-copy.mjs
          node scripts/verify-request-copy.mjs
          node scripts/verify-content.mjs
          node scripts/verify-aliases.mjs
          node scripts/verify-assets.mjs
          node scripts/verify-client-exposure.mjs
          node scripts/verify-font-subset.mjs
          node scripts/verify-llms.mjs

      - name: preview 산출물 폐기
        # 배포되는 것은 production 산출물이다. preview out 을 복원하지 않는다.
        run: rm -rf .next out

      # ── 2) production 빌드 — 실제 배포되는 산출물 ────────────────────────
      - name: Build — production (배포 대상)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: production
          NEXT_PUBLIC_SITE_ORIGIN: https://www.humease.com
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SEARCH_INDEXING_ENABLED: 'true'

      - name: 검증 — production 산출물
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: production
          NEXT_PUBLIC_SITE_ORIGIN: https://www.humease.com
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SEARCH_INDEXING_ENABLED: 'true'
        run: |
          node scripts/verify-routes.mjs
          node scripts/verify-indexing-policy.mjs
          node scripts/verify-copy.mjs
          node scripts/verify-request-copy.mjs
          node scripts/verify-content.mjs
          node scripts/verify-aliases.mjs
          node scripts/verify-assets.mjs
          node scripts/verify-client-exposure.mjs
          node scripts/verify-font-subset.mjs
          node scripts/verify-entities.mjs
          node scripts/verify-llms.mjs

      - name: IndexNow dry-run (외부 전송 없음)
        # INDEXNOW_ENABLED 를 주지 않으므로 후보 목록만 출력하고 종료한다.
        # 실전송은 대표님 승인 후 별도 수동 실행이다. (요청서 §13)
        env:
          NEXT_PUBLIC_SITE_DEPLOY_TARGET: production
        run: node scripts/indexnow.mjs

      - name: Disable Jekyll
        # Custom Domain 은 저장소 Pages 설정(API)에서 관리한다. custom workflow
        # 배포에서는 CNAME 파일이 생성되지 않고, 있어도 무시되며 필요하지 않다.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
